<!DOCTYPE html>
<html>
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SFCD Admin Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background:#eef3f7;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card {
            width:90%;
            max-width:400px;
            background:white;
            padding:35px;
            border-radius:16px;
            box-shadow:0 8px 30px rgba(0,0,0,.12);
        }

        h1 {
            text-align:center;
            color:#17324d;
        }

        input {
            width:100%;
            padding:14px;
            margin:8px 0 18px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
            font-size:16px;
        }

        button {
            width:100%;
            padding:14px;
            border:0;
            border-radius:8px;
            background:#17324d;
            color:white;
            font-size:17px;
            cursor:pointer;
        }

        .error {
            color:#b00020;
            text-align:center;
            margin-bottom:15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>SFCD Admin</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
